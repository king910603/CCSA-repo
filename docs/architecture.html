<!doctype html>
<!-- Source of architecture.pdf. Re-export with:
     msedge --headless --print-to-pdf=architecture.pdf --no-pdf-header-footer docs/architecture.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HW3 Architecture</title>
<style>
  @page { size: A4 landscape; margin: 8mm; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "Segoe UI", Arial, sans-serif; }
  html, body { height: 100%; overflow: hidden; }
  /* Keep the drawing inside one A4 landscape page (210mm - 2 x 8mm margin). */
  svg { display: block; width: 100%; height: auto; max-height: 190mm; }
  text { fill: #1f2937; }
  .title { font-size: 22px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #4b5563; }
  .h { font-size: 15px; font-weight: 700; }
  .b { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #374151; }
  .xs { font-size: 10.5px; fill: #6b7280; }
  .step { font-size: 11.5px; font-weight: 700; fill: #b91c1c; }
  .node { fill: #f8fafc; stroke: #64748b; stroke-width: 1.6; }
  .host { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; }
  .sys { fill: #fff; stroke: #cbd5e1; }
  .band { fill: #eef2ff; stroke: #6366f1; stroke-dasharray: 6 4; }
  .sched { fill: none; stroke: #94a3b8; stroke-dasharray: 4 4; }
  .web { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.6; }
  .api { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
  .db  { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.6; }
  .store { fill: #fef9c3; stroke: #a16207; stroke-width: 1.6; }
  .arrow { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#a); }
  .link { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#g); }
</style>
</head>
<body>
<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Two-node K3s cluster running the web, api and db tiers">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text class="title" x="20" y="34">HW3 — Three-tier web application on a two-node K3s cluster</text>
  <text class="sub" x="20" y="54">Nginx (web) → Flask (api) → PostgreSQL (db) · 3 Deployments × 1 replica · namespace hw3 · deployed with kubectl apply -f k8s/</text>

  <!-- Host -->
  <rect class="host" x="20" y="70" width="1060" height="62" rx="10"/>
  <text class="h" x="36" y="94">Host machine — Vagrant + VirtualBox</text>
  <text class="s" x="36" y="114">Browser opens http://192.168.56.10:30080 (any node IP works) · repo folder is synced into both VMs as /vagrant</text>
  <text class="s" x="700" y="94">vagrant up · vagrant halt · vagrant destroy -f</text>
  <text class="xs" x="700" y="114">.cluster/: join token, kubeconfig, image tarball</text>

  <text class="xs" x="40" y="152">host-only network 192.168.56.0/24 (flannel VXLAN between nodes)</text>
  <line x1="20" y1="160" x2="1080" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="280" y1="160" x2="280" y2="176" stroke="#475569" stroke-width="2"/>
  <line x1="820" y1="160" x2="820" y2="176" stroke="#475569" stroke-width="2"/>

  <!-- Nodes -->
  <rect class="node" x="20" y="176" width="520" height="570" rx="12"/>
  <text class="h" x="36" y="200">k3s-server · control-plane · 192.168.56.10</text>
  <rect class="sys" x="36" y="212" width="488" height="96" rx="6"/>
  <text class="s" x="48" y="232">K3s server: API server, scheduler, controller-manager</text>
  <text class="s" x="48" y="250">CoreDNS: resolves Service names (web, api, db) to ClusterIPs</text>
  <text class="s" x="48" y="268">local-path-provisioner: creates the PV for the db-data PVC</text>
  <text class="s" x="48" y="286">containerd: hw3-web:1.0, hw3-api:1.0 (built here, imported on both nodes)</text>
  <text class="s" x="48" y="302">kube-proxy: NodePort :30080</text>

  <rect class="node" x="560" y="176" width="520" height="570" rx="12"/>
  <text class="h" x="576" y="200">k3s-agent · worker · 192.168.56.11</text>
  <rect class="sys" x="576" y="212" width="488" height="96" rx="6"/>
  <text class="s" x="588" y="232">K3s agent: kubelet, flannel</text>
  <text class="s" x="588" y="250">containerd: hw3-web:1.0, hw3-api:1.0 (imported), postgres:17-alpine</text>
  <text class="s" x="588" y="268">kube-proxy: NodePort :30080</text>
  <text class="s" x="588" y="286">db Pod pinned here (nodeSelector), because a local-path</text>
  <text class="s" x="588" y="302">volume stays on the node where it was created</text>

  <!-- Services band (cluster-wide) -->
  <rect class="band" x="36" y="330" width="1028" height="112" rx="10"/>
  <text class="b" x="50" y="350" fill="#4338ca">Services — cluster-wide virtual IPs, reachable from Pods on either node</text>
  <rect class="web" x="56" y="362" width="300" height="66" rx="8"/>
  <text class="b" x="70" y="385">Service web · NodePort</text>
  <text class="s" x="70" y="404">nodePort 30080 → port 80</text>
  <text class="xs" x="70" y="420">entry point from outside the cluster</text>
  <rect class="api" x="400" y="362" width="300" height="66" rx="8"/>
  <text class="b" x="414" y="385">Service api · ClusterIP</text>
  <text class="s" x="414" y="404">api:5000 → Flask Pod :5000</text>
  <text class="xs" x="414" y="420">internal only</text>
  <rect class="db" x="744" y="362" width="300" height="66" rx="8"/>
  <text class="b" x="758" y="385">Service db · ClusterIP</text>
  <text class="s" x="758" y="404">db:5432 → PostgreSQL Pod :5432</text>
  <text class="xs" x="758" y="420">internal only</text>

  <!-- Pods -->
  <rect class="sched" x="40" y="466" width="680" height="128" rx="10"/>
  <text class="xs" x="52" y="584">web and api Pods are placed by the scheduler on either node</text>
  <rect class="web" x="56" y="478" width="300" height="88" rx="8"/>
  <text class="b" x="70" y="500">Deployment web · 1 replica</text>
  <text class="s" x="70" y="519">nginx:1.29-alpine + static UI</text>
  <text class="s" x="70" y="537">location /api/ → proxy_pass http://api:5000</text>
  <text class="xs" x="70" y="555">image hw3-web:1.0</text>
  <rect class="api" x="400" y="478" width="300" height="88" rx="8"/>
  <text class="b" x="414" y="500">Deployment api · 1 replica</text>
  <text class="s" x="414" y="519">Flask + Gunicorn, psycopg 3</text>
  <text class="s" x="414" y="537">DB_HOST=db, credentials from Secret</text>
  <text class="xs" x="414" y="555">image hw3-api:1.0 · readiness GET /health</text>

  <rect class="db" x="744" y="478" width="300" height="88" rx="8"/>
  <text class="b" x="758" y="500">Deployment db · 1 replica</text>
  <text class="s" x="758" y="519">postgres:17-alpine · strategy Recreate</text>
  <text class="s" x="758" y="537">PGDATA=/var/lib/postgresql/data/pgdata</text>
  <text class="xs" x="758" y="555">Secret db-credentials · pg_isready probes</text>

  <!-- Storage -->
  <rect class="store" x="744" y="618" width="300" height="52" rx="8"/>
  <text class="b" x="758" y="640">PVC db-data</text>
  <text class="s" x="758" y="659">storageClass local-path · RWO · 1Gi</text>
  <rect class="store" x="744" y="684" width="300" height="52" rx="8"/>
  <text class="b" x="758" y="706">PV on k3s-agent disk</text>
  <text class="s" x="758" y="725">/var/lib/rancher/k3s/storage/pvc-…</text>
  <path class="link" d="M894,670 L894,684"/>
  <path class="link" d="M894,566 L894,618"/>
  <text class="xs" x="902" y="598">mounted at /var/lib/postgresql/data</text>

  <!-- Request path -->
  <path class="arrow" d="M28,132 L28,395 L56,395"/>
  <text class="step" x="40" y="323">① HTTP :30080 on any node IP</text>
  <path class="arrow" d="M206,428 L206,478"/>
  <path class="arrow" d="M356,522 C380,522 380,410 400,410"/>
  <text class="step" x="292" y="460">② /api/*</text>
  <path class="arrow" d="M550,428 L550,478"/>
  <path class="arrow" d="M700,522 C724,522 724,410 744,410"/>
  <text class="step" x="636" y="460">③ SQL</text>
  <path class="arrow" d="M894,428 L894,478"/>

  <!-- Legend -->
  <text class="b" x="36" y="626">Data survives</text>
  <text class="s" x="36" y="646">• db Pod deletion: the new Pod mounts the same PVC</text>
  <text class="s" x="36" y="664">• vagrant halt / vagrant up: K3s restarts from systemd, the PV stays on disk</text>
  <text class="s" x="36" y="682">• deploy.sh re-applies k8s/ on every boot (kubectl apply is idempotent)</text>
  <text class="s" x="36" y="700">• lost only on vagrant destroy -f</text>
  <text class="step" x="36" y="728">①②③ request path: browser → Nginx → Flask → PostgreSQL</text>
</svg>
</body>
</html>
